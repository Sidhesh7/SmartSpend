version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smartspend-postgres
    restart: always
    environment:
      POSTGRES_USER: smartspend
      POSTGRES_PASSWORD: smartspendpassword
      POSTGRES_DB: smartspend_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: smartspend-ml-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartspend-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=smartspend-super-secure-production-jwt-token
      - ML_SERVICE_URL=http://ml-service:8000
      - NODE_ENV=production
    depends_on:
      - ml-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartspend-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
